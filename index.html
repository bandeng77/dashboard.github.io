<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mainmenu Genetek</title>
  <script>try{var t=localStorage.getItem("gt-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body data-mode="public">
<div class="bgfx" aria-hidden="true"></div>
<header class="topbar">
  <div class="tbar">
    <a class="brand" id="brand" href="/" aria-label="Genetek">
      <span class="logo"><img src="https://i.imgur.com/XjT4AO0.png" alt="Genetek" onerror="document.getElementById('brand').classList.add('nologo')"></span>
      <span class="wm"><span class="mk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M20 8.5A8.5 8.5 0 1 0 20.5 13H13"/></svg></span><span><b>GENETEK</b><small>Mainmenu</small></span></span>
    </a>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="gsearch" type="search" placeholder="Cari aplikasi, divisi, atau karyawan…" autocomplete="off" aria-label="Cari aplikasi, divisi, atau karyawan">
      <div class="sres" id="gres" hidden></div>
    </div>
    <div class="tools">
      <div class="clk"><b id="clockTime">--.--</b><span id="clockDay">—</span><i class="sun" id="sun"></i></div>
      <button class="tool" id="themeBtn" type="button" aria-label="Ganti mode gelap atau terang" title="Ganti mode gelap/terang"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
    </div>
  </div>
</header>

<div class="wrap" id="top">
  <section class="hero">
    <div><h1>Selamat datang di <em>kantor Genetek</em></h1><p>Klik divisi di bawah, atau klik karyawan di gedung, untuk membuka aplikasi yang dipakai divisi tersebut.</p></div>
    <span class="mode" id="mode" hidden>Menghubungkan…</span>
  </section>

  <nav class="divbar" id="divbar" aria-label="Divisi dan aplikasinya"></nav>

  <div class="kpis" id="kpis"></div>

  <div class="main solo">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="Gedung kantor 4 lantai. Klik karyawan atau divisi untuk membuka aplikasinya."></canvas>
      <div class="hud tl">
        <div class="seg" role="group" aria-label="Lantai" id="floorSeg">
          <button data-view="out" aria-pressed="false">Gedung</button>
          <button data-view="0" aria-pressed="true">Lt 1</button>
          <button data-view="1" aria-pressed="false">Lt 2</button>
          <button data-view="2" aria-pressed="false">Lt 3</button>
          <button data-view="3" aria-pressed="false">Lt 4</button>
        </div>
        <span class="spacer"></span>
        <div class="seg" role="group" aria-label="Label di atas kepala" id="labelSeg">
          <span class="lbl">Label</span>
          <button data-lab="full" aria-pressed="true">Lengkap</button>
          <button data-lab="div" aria-pressed="false">Divisi</button>
          <button data-lab="off" aria-pressed="false">Mati</button>
        </div>
        <button class="hudbtn" id="plaqBtn" aria-pressed="true">Nama ruang</button>
      </div>
      <div class="follow" id="follow" hidden></div>
      <div class="hub" id="hub" hidden></div>
      <div class="hud bl">
        <button class="hudbtn" id="zin" aria-label="Perbesar">＋</button>
        <button class="hudbtn" id="zout" aria-label="Perkecil">－</button>
        <button class="hudbtn" id="zfit">Pusatkan</button>
        <span class="spacer"></span>
        <div class="seg" role="group" aria-label="Waktu" id="daySeg"><button data-day="auto" aria-pressed="true">Otomatis</button><button data-day="day" aria-pressed="false">Siang</button><button data-day="night" aria-pressed="false">Malam</button></div>
      </div>
      <div class="tip" id="tip" hidden></div>
    </div>

  </div>

  <section class="apps" id="apps">
    <div class="sec-head"><h2><span class="i"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="m12 2 9 5v10l-9 5-9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg></span>Aplikasi Utama</h2><span class="count" id="appCount">—</span></div>
    <div class="afilter" id="afilter" role="group" aria-label="Saring aplikasi per divisi"></div>
    <div class="apps-grid" id="appsGrid"></div>
  </section>

  <section class="apps" aria-label="Info dan sertifikat">
    <div class="sec-head"><h2><span class="i"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 8 5-3 5 3-1.5-8"/></svg></span>Info & Sertifikat</h2></div>
    <div class="info" id="info"></div>
  </section>

  <footer>
    <p>&copy; 2026 <b>Genetek</b>. All rights reserved.</p>
    <p>Engineered by <a href="https://effrensindokencana.com" target="_blank" rel="noopener">Effrensindo Kencana</a></p>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>

  <script type="module" src="/assets/firebase.js"></script>
  <script src="/assets/app.js" defer></script>
</body>
</html>
